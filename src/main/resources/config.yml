# AdvancedTrainControlSystem configuration.
#
# Stations, lines, services and departure boards are defined in network.yml.
# Passenger texts and board layouts are in messages.yml.
# Apply changes with /atcs reload.
config-version: 3

passenger:
  # Passenger information is shown to riders with the atcs.passenger permission (everyone by default).
  enabled: true
  # Persistent bar in the line colour: line, service, destination, next stop and arrival estimate.
  boss-bar: true
  # Station name as a title when the train arrives.
  arrival-title: true
  title-fade-in-ticks: 5
  title-stay-ticks: 50
  title-fade-out-ticks: 15
  # "Next station" and interchange messages in chat when the train departs.
  chat-announcements: true
  # Show "Now approaching" when the head of the train is this many blocks from the next stop's
  # platform sign. 0 disables it.
  approach-distance: 60
  # Brief "Passing <station>" note when a train runs through a station without stopping.
  show-passing: true
  # What riders of trains without a service see at a known platform: NONE or TITLE.
  unassigned-trains: TITLE
  sounds:
    # Any Minecraft sound key; leave empty to disable.
    arrival: "minecraft:block.note_block.chime"
    departure: ""
    approaching: ""
    # Sound category the client volume slider applies to: master, music, record, weather, block,
    # hostile, neutral, player, ambient, voice.
    category: ambient
    volume: 0.8
    pitch: 1.0

boards:
  refresh-ticks: 20
  # Assumed stop length used in arrival estimates until real stop lengths have been learned.
  default-dwell-seconds: 10

displays:
  # Displays are pictures on map items in item frames (/atcs display roadmap, logo, board, map,
  # status) and hologram boards (/atcs display hologram), placed with the wand (/atcs wand).
  # Frames that hold a display are fixed so players cannot rotate or empty them; set to false to
  # leave them as they are.
  fix-frames: true
  # Station signs (/atcs display logo): new-york (white on black under a white stripe, with route
  # bullets) or hong-kong (dark on white over a band of the line colours). A sign can say
  # otherwise: /atcs display logo <station> hong-kong.
  sign-style: new-york
  # The flaps of departure boards turn through the alphabet to new departures, as at an airport.
  # Off, a board changes at once (and sends players fewer map updates).
  board-animation: true
  hologram:
    # How many departures a hologram board lists.
    departures: 5
    # Text size, 1 being the vanilla size.
    scale: 1.0
    # Whether hologram boards show through blocks.
    see-through: false

timing:
  # Between 0 and 1: how quickly learned travel times follow new measurements.
  smoothing: 0.3
  save-interval-minutes: 5
  # Blocks per second assumed on a stretch no train has been timed on yet, so boards show an
  # estimate (marked ~) instead of Expected. Once enough track has been learned, the railway's
  # own usual speed is used instead.
  assumed-speed: 8

integrations:
  bluemap:
    enabled: true
    marker-set-label: "Railway"
    show-stations: true
    show-lines: true
    show-trains: true
    train-refresh-ticks: 40
    # Record the path each service's trains take so map lines follow the real track instead of
    # straight lines between stations.
    record-track-paths: true
    line-width: 5
    # Draw stations as their logos (a ring in the colours of the lines calling there, with the
    # station's short code) and trains as line badges. Drop your own pictures into the plugin's
    # logos/ folder (<station>.png, line-<id>.png) to replace any of them.
    logos: true
    station-icon-size: 40
    # Stations served by one line that are not a terminus disappear when the camera is further
    # away than this many blocks, so a zoomed-out map shows the interchanges and ends. 0 keeps all.
    minor-station-max-distance: 1500
    train-icons: true
  signlink:
    # Publishes departures as SignLink variables short enough to type on a sign, from each
    # station's short code: %gb.1d% (next destination at Golden Beach), %gb.1t% (its time),
    # %gb.p3.1t% (next train's time on platform 3). /atcs station here lists them for a platform.
    enabled: true
    departures-per-station: 3
  web:
    # Writes the railway website (network map, live trains, departures, trip planner) as static
    # files. With BlueMap installed and no folder set, they go to BlueMap's web root under /atcs,
    # so the site is at <your BlueMap address>/atcs/ and BlueMap's page gets a "Railway" button.
    enabled: true
    # A folder served by your own web server, relative to the server directory or absolute.
    folder: ""
    title: "Railway"
    # How often trains and departures are written, in seconds.
    refresh-seconds: 3
    bluemap-button: true
  editor:
    # The web editor: stations, lines and services, boards, transfers, fares, the diagram and
    # the configuration files, in a browser. Off until enabled. /atcs editor prints a one-time
    # link; every save goes through the same checks as the commands, and a file edited by hand
    # on disk is never overwritten.
    enabled: false
    # Listens on this address and port. Keep 127.0.0.1 and put a reverse proxy in front for
    # access from elsewhere, or set the server's address to open it up directly.
    bind: 127.0.0.1
    port: 8111
    # The host name the printed link uses, when it differs from the bind address (behind a proxy).
    host: ""
    # A session ends after this long without use.
    session-minutes: 120

trains:
  # Name trains after their service when ATCS assigns one, for example A-to-main-2 instead of
  # train17 (spawn-sign trains included). Only names TrainCarts generated are replaced; a train
  # you named yourself keeps its name. Placeholders: <line> (badge), <service>, <n>.
  rename: true
  name-format: "<line>-<service>-<n>"
  # Switch TrainCarts' keep-chunks-loaded on for every train, so trains keep running with nobody
  # around. Each train then holds only the chunks around itself, which is far cheaper than
  # force-loading the railway. ATCS also holds the chunks of trains on a service that are not
  # loaded, so a train that stood at a station when the server stopped comes back after a
  # restart even with TrainCarts' keepChunksLoadedOnlyWhenMoving. Fleet trains do all this even
  # when it is off: a fleet counts every train of its service, so one frozen where nobody is
  # would keep the fleet from ever sending a replacement.
  keep-chunks-loaded: false

spawning:
  # Hold the chunks of every spawn sign listed in network.yml and of every fleet spawn point, so
  # timed spawn signs keep firing and fleets can spawn with nobody around.
  keep-spawn-chunks-loaded: true
  # How often fleets are checked (seconds).
  check-seconds: 5

assignment:
  # Give a train that has no service the one service whose stop order matches the stations it
  # has been seen at. This is how trains that no spawn sign, sign or command ever assigned get
  # their service, for example the trains of a loop line that run all day. A train that later
  # strays onto another line is re-inferred; one cleared with /atcs train unassign is left alone.
  infer-from-route: true
  # Stations a train must be seen at, in order, before its service is inferred. The window grows
  # automatically while more than one service fits.
  min-stops: 2

importer:
  # Announcement prefixes that introduce a station name, as in "Arrived: Main St.".
  arrival-prefixes: ["Arrived:", "Arrive:", "Arriving:", "Arrival:", "This is", "Now at"]
  # Endings that mark a line of an ordinary sign as a station name board.
  station-name-suffixes: ["St.", "Station", "Stn"]
  # Endings dropped from a station name when deriving its id ("Main St." -> main).
  id-strip-suffixes: ["St.", "St", "Station", "Stn"]
  # How far (in blocks) from a station sign names and hints are looked for.
  search-radius: 16
  vertical-tolerance: 6
  # Stop signs with the same name further apart than this become separate stations.
  cluster-radius: 96
  # Chunks inspected per server tick while scanning.
  chunks-per-tick: 8

control:
  # 'atcs station' signs stop the trains whose service calls at the station and let the others run
  # through. What happens to a train that has no service: stop or pass.
  unknown-trains: stop
  # And to a train whose service does not list the station at all, for example an express running
  # through a local station: stop or pass.
  off-route-trains: pass
  # How long a train waits at a station sign that gives no time of its own.
  dwell-seconds: 10
  # Minimum time between two departures of the same line from the same platform, for every station
  # sign without a 'gap' of its own. 0 switches it off.
  headway-seconds: 0
  # Keep a train at the platform while the train that left before it has not reached its next
  # station yet. Signs can say 'block' or 'noblock' to override this.
  hold-for-clear-section: false
  # A held train is let go after this long whatever the reason, so a train ATCS lost track of can
  # never block a platform for good.
  max-hold-seconds: 180
  # Even spacing: a train that is catching up the one in front is held a little longer at the
  # platform, so the gaps between the trains of a service come out equal and a loop line stops
  # bunching. Signs can say 'even' or 'noeven' to override this. Never more than the extra below.
  even-spacing: false
  even-max-hold-seconds: 60
  # Junction priority: a train about to leave a platform whose next stretch of track runs into a
  # junction waits while another train is approaching that junction, unless it goes first: the
  # late train first, then the line listed earlier in 'priority', then the nearer train. Needs
  # recorded track (the rail graph) so ATCS knows where the junctions are.
  junction-priority: false
  priority: []
  # Keep every train's TrainCarts destination at its next calling stop (named station:platform, as
  # every 'atcs station' sign registers itself), so TrainCarts switcher signs and 'route' stations
  # find the way there by path-finding. Leave off if you route trains with destinations yourself.
  set-destinations: false
  # The TrainCarts destination a train is given when a dispatcher sends it to the depot
  # (/atcs train depot), so TrainCarts path-finding and 'atcs switch' signs with a 'depot' rule
  # take it there. An 'atcs depot' sign at the end takes the empty train out of the world.
  depot-destination: depot

logging:
  # Append every arrival, departure, hold and service change to data/events.log, one JSON object
  # per line, for looking into what happened after the fact. Rotated to events.1.log at the size
  # below, so it is bounded.
  events: true
  # Also log every running train's position and speed twice a second. Heavier; useful for
  # checking arrival estimates against where trains really were.
  positions: false
  max-megabytes: 8

# Logs every platform observation and journey event to the console.
debug: false
