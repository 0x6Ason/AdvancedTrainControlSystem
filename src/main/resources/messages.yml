# AdvancedTrainControlSystem passenger texts, in MiniMessage format:
# https://docs.advntr.dev/minimessage/format.html
#
# Placeholders:
#   <line> <line_short>     line name and badge text, e.g. "Line A Upperground" and "A"
#   <line_color>...</line_color>   colours the enclosed text in the line colour
#   <service>               service name, e.g. "Local"
#   <destination>           final destination, or the service name on circular services
#   <station> <platform>    the station (and platform) the train is at or arriving at
#   <next>                  the next calling station
#   <eta>                   estimated time to the next station (boss bar) or to arrival (boards)
#   <interchanges>          other lines calling at the station, and lines a walking transfer away
#   <suspension>            the notice set with /atcs line suspend
#
# Set a message to "" to turn it off.

passenger:
  boss-bar:
    running: "<line_color><b><line_short></b></line_color> <white><service> to <destination></white> <dark_gray>|</dark_gray> <gray>Next:</gray> <white><next></white><eta_suffix>"
    eta-suffix: " <dark_gray>(<eta>)</dark_gray>"
    # Replaces the suffix when the train is overdue at its next stop.
    delayed-suffix: " <red>(delayed)</red>"
    at-station: "<line_color><b><line_short></b></line_color> <white><station></white> <dark_gray>|</dark_gray> <gray><service> to <destination></gray>"
    terminating: "<line_color><b><line_short></b></line_color> <white><station></white> <dark_gray>|</dark_gray> <gray>This train terminates here</gray>"
    not-in-service: "<line_color><b><line_short></b></line_color> <gray>Not in service</gray>"
    # While ATCS keeps the train at the platform for a headway or the train in front; <reason> says why.
    waiting: "<line_color><b><line_short></b></line_color> <white><station></white> <dark_gray>|</dark_gray> <gray>Waiting: <reason></gray>"
    # A train standing still between stations: the estimate stops counting down.
    held: "<line_color><b><line_short></b></line_color> <white><service> to <destination></white> <dark_gray>|</dark_gray> <gray>Next:</gray> <white><next></white> <dark_gray>(held)</dark_gray>"
    suspended: "<red><b>Service suspended</b></red> <dark_gray>|</dark_gray> <white><suspension></white>"
  # How <eta> reads when part of it is a guess from track distance rather than learned from trains.
  eta-approximate: "~<eta>"
  boarding: "<gray>This is a</gray> <line_color><line></line_color> <gray><service> service to</gray> <white><destination></white>"
  arrival-title: "<line_color><station></line_color>"
  arrival-subtitle: "<gray><line> <dark_gray>·</dark_gray> <service> to <destination></gray>"
  terminus-subtitle: "<gray>This train terminates here</gray>"
  terminus-chat: "<gray>This train terminates here. Please take all your belongings with you.</gray>"
  interchange-here: "<gray>Change here for</gray> <interchanges><gray>.</gray>"
  next-station: "<line_color>»</line_color> <gray>Next station:</gray> <white><next></white>"
  next-station-terminus: "<line_color>»</line_color> <gray>Next station:</gray> <white><next></white><gray>, where this train terminates.</gray>"
  interchange-next: "<gray>Change at <next> for</gray> <interchanges><gray>.</gray>"
  approaching: "<gray>Now approaching</gray> <white><next></white>"
  passing: "<gray>Passing</gray> <white><station></white>"
  unassigned-arrival-title: "<white><station></white>"
  unassigned-arrival-subtitle: ""
  # Told to riders when a dispatcher makes the train run through a station it would call at.
  skip-stop: "<red>This train will not stop at</red> <white><station></white><red>.</red>"
  # Told to riders when the train turns back short of its destination. <station>, <destination>.
  short-turn: "<red>This train terminates at</red> <white><station></white><red> and returns towards</red> <white><destination></white><red>.</red>"
  # Told to riders when a dispatcher sends the train to the depot; it will not stop again.
  to-depot: "<red>This train is going out of service and will not stop at the next stations.</red>"
  # Separator between lines in <interchanges>.
  interchange-separator: "<gray>, </gray>"
  # Lines reached through a walking transfer, as part of <interchanges>. <lines>, <station>.
  interchange-walk: "<lines> <gray>(walk to <station>)</gray>"

hologram:
  # A hologram board (/atcs display hologram): the header, then one line per departure.
  header: "<white><b><station></b></white><platform_suffix>"
  platform-suffix: " <gray>Platform <platform></gray>"
  departure: "<line_color><b><line_short></b></line_color> <white><destination></white>  <status>  <dark_gray>P<platform></dark_gray>"
  empty: "<gray>No departures</gray>"

board:
  # Each board sign shows one departure on its four lines.
  departure:
    - "<line_color><b><line_short></b></line_color> <black><service></black>"
    - "<black><destination></black>"
    - "<status>"
    - "<dark_gray>Platform <platform></dark_gray>"
  status-due: "<dark_blue><eta></dark_blue>"
  status-boarding: "<dark_green>Boarding</dark_green>"
  status-arriving: "<dark_green>Arriving</dark_green>"
  status-unknown: "<dark_gray>Expected</dark_gray>"
  # A countdown that is partly a guess from track distance.
  status-estimated: "<gray>~<eta></gray>"
  # The train has been on its way longer than trains usually take.
  status-delayed: "<red>Delayed</red>"
  status-suspended: "<dark_red>Suspended</dark_red>"
  # Shown on the remaining signs when there are fewer departures than signs.
  empty:
    - ""
    - "<dark_gray>No further</dark_gray>"
    - "<dark_gray>departures</dark_gray>"
    - ""

# Automatic fares (/atcs fare billing). <fare> is an amount with its currency, <from> and <to> are
# station names, <seconds> is the transfer window and <receipt> the number staff settle it by.
fare:
  refused-balance: "<red>You need at least</red> <white><fare></white> <red>to ride this train.</red>"
  refused-debt: "<red>You still owe</red> <white><fare></white> <red>for an earlier journey. Top up your balance to ride again.</red>"
  refused-review: "<red>A payment of</red> <white><fare></white> <red>needs checking by staff before you can ride again (receipt <receipt>).</red>"
  journey-pending: "<gray>Fare so far</gray> <white><fare></white><gray>. Board another train within <seconds>s to continue your journey.</gray>"
  # Follows journey-pending: a button that ends the journey and charges it now instead of waiting.
  end-trip: "<click:run_command:'/atcs fare endtrip'><hover:show_text:'<gray>Pay now; your next train starts a new journey</gray>'><aqua>[End trip]</aqua></hover></click>"
  transfer: "<gray>Transfer: your journey from</gray> <white><from></white> <gray>continues.</gray>"
  paid: "<gray>Charged</gray> <white><fare></white> <gray>for</gray> <white><from></white> <gray>to</gray> <white><to></white><gray>.</gray>"
  # A journey that cost nothing, for example on a free line.
  free: ""
  declined: "<red>Could not charge</red> <white><fare></white> <red>for <from> to <to>; it is collected when you next board.</red>"
  uncertain: "<red>The payment of</red> <white><fare></white> <red>for <from> to <to> could not be confirmed; staff will check it (receipt <receipt>).</red>"

# Formats used for <eta>: under a minute and from one minute.
time:
  seconds: "<seconds>s"
  minutes: "<minutes>:<seconds_padded>"
