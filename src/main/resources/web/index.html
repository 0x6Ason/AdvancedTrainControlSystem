<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<title>Railway</title>
<style>html,body{margin:0;height:100%;background:#fff}@media (prefers-color-scheme:dark){html,body{background:#121212}}</style>
</head>
<body>
<div id="app"></div>
<script>
/* Loads the current version of the site. Web servers such as BlueMap's let browsers keep this
 * page for a day, so it never changes: it asks for the version number, which is never cached,
 * and loads the files stamped with it. */
(function () {
  'use strict';
  function start(version) {
    var v = encodeURIComponent(version);
    var css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = 'app.css?v=' + v;
    document.head.appendChild(css);
    ['layout.js', 'planner.js', 'map.js', 'app.js'].forEach(function (name) {
      var script = document.createElement('script');
      script.src = name + '?v=' + v;
      script.async = false;
      document.head.appendChild(script);
    });
  }
  fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (response) { return response.json(); })
    .then(function (data) { start(data.version || String(Date.now())); })
    .catch(function () { start(String(Date.now())); });
})();
</script>
</body>
</html>
