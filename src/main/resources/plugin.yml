name: AdvancedTrainControlSystem
version: '${version}'
main: dev.advancedtrains.atcs.AtcsPlugin
api-version: '1.21.4'
description: Passenger information, departure boards and network maps for TrainCarts railways.
authors: [jason]
depend: [BKCommonLib, Train_Carts]
softdepend: [BlueMap, SignLink]

commands:
  atcs:
    description: AdvancedTrainControlSystem commands.
    usage: /atcs help
    aliases: [traincontrol]

permissions:
  atcs.use:
    description: Look up stations, lines, trains and departures.
    default: true
  atcs.passenger:
    description: See passenger information (boss bar, arrival titles, announcements) while riding.
    default: true
  atcs.manage:
    description: Edit the network, boards and train assignments; import, reload and status.
    default: op
  atcs.sign.build:
    description: Build ATCS TrainCarts signs (atcs stop, atcs service, atcs clear).
    default: op
  atcs.admin:
    description: Everything in ATCS.
    default: op
    children:
      atcs.use: true
      atcs.passenger: true
      atcs.manage: true
      atcs.sign.build: true
