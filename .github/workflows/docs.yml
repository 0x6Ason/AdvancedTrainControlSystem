name: Docs

on:
  push:
    branches: [main]
    paths: ['docs/**', 'mkdocs.yml', 'README.md', 'CHANGELOG.md', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'mkdocs.yml', 'README.md', 'CHANGELOG.md', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: pip install mkdocs-material

      # --strict turns every warning (a broken link, a page missing from the nav) into a failure.
      - run: mkdocs build --strict

      - name: Upload the site
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: site

      # Publishing needs GitHub Pages, which a private repository on a free plan does not have.
      # Set the repository variable PUBLISH_DOCS to true once Pages is enabled.
      - name: Upload for Pages
        if: vars.PUBLISH_DOCS == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    if: vars.PUBLISH_DOCS == 'true' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
