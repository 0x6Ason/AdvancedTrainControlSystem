name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build, test and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # Compiles, runs the unit tests, checks the generated reference pages against the
      # committed ones, and enforces the English-only text policy (all part of `check`).
      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload plugin jar
        uses: actions/upload-artifact@v7
        with:
          name: AdvancedTrainControlSystem
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test

  # The compatibility matrix: the same build against the other server and TrainCarts versions
  # ATCS promises to work with (README, "Requirements"). The baseline job above is the oldest
  # combination; these are the newest of the 1.21 line and the current Paper.
  compat:
    name: ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Paper 1.21.11, TrainCarts 2.0.2
            java: '21'
            paper: 1.21.11-R0.1-SNAPSHOT
            traincarts: 2.0.2
            bkcommonlib: 2.0.4
            signlink: 2.0.0
          - name: Paper 26.3, TrainCarts 2.0.2
            java: '25'
            paper: 26.3.build.200-stable
            traincarts: 2.0.2
            bkcommonlib: 2.0.4
            signlink: 2.0.0
    steps:
      - uses: actions/checkout@v7

      # The JDK the row compiles and tests with. Gradle itself runs on 21 (installed last, so it
      # is JAVA_HOME): this Gradle cannot run on 25 yet, but it can use 25 as a toolchain.
      - uses: actions/setup-java@v6
        if: matrix.java != '21'
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: >-
          ./gradlew build --no-daemon
          -PjavaVersion=${{ matrix.java }}
          ${{ matrix.java != '21' && format('-Porg.gradle.java.installations.paths={0}', env[format('JAVA_HOME_{0}_X64', matrix.java)]) || '' }}
          -Porg.gradle.java.installations.auto-download=false
          -PpaperApi=${{ matrix.paper }}
          -PtrainCarts=${{ matrix.traincarts }}
          -PbkCommonLib=${{ matrix.bkcommonlib }}
          -PsignLink=${{ matrix.signlink }}
