name: Release

# Pushing a tag such as v0.2.0 builds the plugin from it and publishes a GitHub release with the
# jar attached and the version's section of CHANGELOG.md as the notes.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build --no-daemon

      # The tag names the version in build.gradle.kts, so the jar, /atcs status and the release agree.
      - name: Check the version
        run: |
          version=$(./gradlew -q properties --no-daemon | sed -n 's/^version: //p')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME does not match the version $version in build.gradle.kts"
            exit 1
          fi

      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## $version " 'index($0, heading) == 1 {on = 1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version"
            exit 1
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          build/libs/AdvancedTrainControlSystem-*.jar
          --title "ATCS ${GITHUB_REF_NAME#v}"
          --notes-file notes.md
